name: Verify agents
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint && pnpm run typecheck && pnpm test && pnpm run test:contracts
      - run: pnpm run test:senate-chain
      - run: pnpm run test:release-chain
      - run: pnpm run test:forecast-chain
      - run: pnpm run test:checkpoint-chain
      - run: pnpm run test:compute-chain
      - run: pnpm run test:press-chain
      - run: pnpm run test:launch-chain
      - run: pnpm run test:sentinel-chain
      - run: pnpm run test:rwa-chain
      - run: pnpm run test:bourse-chain
      - run: pnpm run test:traveler-chain
      - run: pnpm run test:referee-chain
      - run: pnpm run test:familiar-chain
      - run: pnpm run test:coroner-chain
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [day-01-wallet-genesis, day-02-pay-per-prompt, day-03-agent-passport, day-04-mcp-mercenary, day-05-stablecoin-autopilot, day-06-intent-calligrapher, day-07-glass-box-mind, day-08-swarm-senate, day-09-forecast-colosseum, day-10-human-checkpoint, day-11-gpu-night-market, day-12-provenance-press, day-13-agent-launch-gantry, day-14-guardrail-sentinel, day-15-real-world-concierge, day-16-bot-to-bot-bourse, day-17-memecoin-coroner, day-18-encrypted-confidant, day-19-group-chat-familiar, day-20-restaked-referee, day-21-chainless-traveler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build --build-arg APP=${{ matrix.app }} -t dapptober-check .
      - name: Verify standalone container and complete independent agent workflow
        env:
          APP: ${{ matrix.app }}
        run: |
          docker run -d --name agent-check -p 3000:3000 -e AGENT_MODE=demo -e PUBLIC_ORIGIN=http://localhost:3000 dapptober-check
          trap 'docker logs agent-check; docker rm -f agent-check' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 2 --fail http://localhost:3000/ > /tmp/agent-page.html
          test -s /tmp/agent-page.html
          curl --fail http://localhost:3000/api/agent > /tmp/agent-state.json
          python3 -c 'import json; s=json.load(open("/tmp/agent-state.json")); assert s["state"]["mode"] == "demo"; assert s["receiptsValid"] is True'
          day=$((10#${APP:4:2}))
          SMOKE_PORT_BASE=$((3000-day)) node scripts/smoke.mjs "$day"
  tee-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/glass-box-tee/Dockerfile -t dapptober-tee-check .
  gpu-provider-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/gpu-provider/Dockerfile -t dapptober-gpu-provider-check .
